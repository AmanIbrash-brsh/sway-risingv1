# ---------- Font ----------
font_family       family="JetBrains Mono" style="Medium"
bold_font         family="JetBrains Mono" style="ExtraBold"
italic_font       family="JetBrains Mono" style="Medium Italic"
bold_italic_font  family="JetBrains Mono" style="ExtraBold Italic"
font_size 13.5
# Ligatures (-> => != ===) stay on; they only break when the cursor is on them
disable_ligatures cursor
adjust_line_height 106%
# Nerd Font icons are built into kitty and picked up automatically

# ---------- Window / glass ----------
background_opacity 0.80
dynamic_background_opacity yes
background_blur 0
window_padding_width 12 14
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
initial_window_width 110c
initial_window_height 32c

# ---------- Cursor ----------
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.6 ease-in-out
cursor_trail 3
cursor_trail_decay 0.1 0.35
cursor_trail_start_threshold 2

# ---------- Scrollback ----------
scrollback_lines 20000
scrollback_pager_history_size 100
mouse_hide_wait 2.0
copy_on_select clipboard
strip_trailing_spaces smart

# ---------- Tabs ----------
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_title_template "{index}: {title[:24]}"
active_tab_font_style bold
tab_bar_margin_width 8
tab_bar_margin_height 6 0

# ---------- Splits ----------
enabled_layouts splits:split_axis=horizontal,stack,tall
active_border_color #bb9af7
inactive_border_color #3b4261
inactive_text_alpha 0.75
window_border_width 1pt

# ---------- URLs ----------
url_color #7dcfff
url_style curly
detect_urls yes
underline_hyperlinks hover

# ---------- Bell ----------
enable_audio_bell no
visual_bell_duration 0.15 ease-out
window_alert_on_bell yes

# ---------- Colors: Tokyo Night Storm tuned for glass ----------
foreground            #c0caf5
background            #11111b
selection_foreground  #11111b
selection_background  #bb9af7
cursor                #ff9e64
cursor_text_color     #11111b
url_color             #7dcfff

active_tab_foreground    #11111b
active_tab_background    #bb9af7
inactive_tab_foreground  #a9b1d6
inactive_tab_background  #1f2335
tab_bar_background       none

mark1_foreground #11111b
mark1_background #ff9e64

color0  #414868
color8  #565f89
color1  #f7768e
color9  #ff899d
color2  #9ece6a
color10 #b9f27c
color3  #e0af68
color11 #ffc777
color4  #7aa2f7
color12 #8db0ff
color5  #bb9af7
color13 #c9a9ff
color6  #7dcfff
color14 #a4daff
color7  #a9b1d6
color15 #c0caf5

# ---------- Shortcuts ----------
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+alt+enter   launch --location=hsplit --cwd=current
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down
map ctrl+shift+z     toggle_layout stack
map ctrl+shift+equal change_font_size current +1.0
map ctrl+shift+minus change_font_size current -1.0
map ctrl+shift+0     change_font_size current 0
map ctrl+shift+alt+left  previous_tab
map ctrl+shift+alt+right next_tab
map ctrl+shift+f     show_scrollback
map ctrl+shift+o     kitten hints --type path --program -
map ctrl+shift+e     kitten hints --type url
map ctrl+shift+u     kitten unicode_input
map ctrl+shift+backspace set_background_opacity +0.05
map ctrl+shift+delete    set_background_opacity -0.05
