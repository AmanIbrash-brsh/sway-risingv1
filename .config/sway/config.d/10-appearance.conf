# Monochrome
set $base     #0c0c0c
set $mantle   #000000
set $surface0 #1c1c1c
set $surface1 #2e2e2e
set $text     #e8e8e8
set $subtext  #8c8c8c
set $accent   #f5f5f5
set $red      #ff5c5c

font pango:JetBrains Mono 10

default_border pixel 1
default_floating_border pixel 1
hide_edge_borders smart
gaps inner 10
gaps outer 6
smart_gaps on

# border        background  text    indicator  child_border
client.focused           $accent   $base  $text  $accent $accent
client.focused_inactive  $surface1 $base  $subtext $surface1 $surface1
client.unfocused         $surface0 $base  $subtext $surface0 $surface0
client.urgent            $red      $base  $text  $red    $red
client.placeholder       $base     $base  $text  $base   $base
client.background        $base

# Autostart
exec_always sh -c 'pkill -x dunst; exec dunst'
exec_always sh -c 'pkill -x nm-applet; exec nm-applet --indicator'
bindsym $mod+Shift+x exec swaylock -f

# Touchpad
input type:touchpad {
    tap enabled
    tap_button_map lrm
    natural_scroll enabled
    dwt enabled
    middle_emulation enabled
    pointer_accel 0.3
}

# Window rules
for_window [app_id="pavucontrol|nm-connection-editor|blueman-manager"] floating enable, resize set 700 500, border pixel 2
for_window [window_role="pop-up"] floating enable
for_window [app_id="rofi"] border none
titlebar_padding 6 3
focus_follows_mouse no
workspace_auto_back_and_forth yes
bindsym $mod+Shift+p exec ~/.config/rofi/powermenu.sh

# Wallpaper + idle/lock
output * bg ~/Pictures/wallpapers/current fill
exec_always ~/.config/sway/idle.sh
