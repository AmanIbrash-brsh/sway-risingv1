# Monochrome
set $base     #0c0c0c
set $mantle   #000000
set $surface0 #1c1c1c
set $surface1 #2e2e2e
set $text     #e8e8e8
set $subtext  #8c8c8c
set $accent   #f5f5f5
set $red      #ff5c5c

font pango:JetBrains Mono 10

default_border pixel 1
default_floating_border pixel 1
hide_edge_borders smart
gaps inner 10
gaps outer 6
smart_gaps on

# border        background  text    indicator  child_border
# Window borders and tab / title bars: same palette as kitty and DMS (Tokyo Night + purple accent)
#                        border    bg        text     indicator child_border
client.focused           #bb9af7   #bb9af7   #11111b  #bb9af7   #bb9af7
client.focused_inactive  #3b4261   #2a2f45   #c0caf5  #3b4261   #3b4261
client.unfocused         #1f2335   #1a1b26   #7a83a8  #1f2335   #1f2335
client.urgent            #f7768e   #f7768e   #11111b  #f7768e   #f7768e
client.placeholder       $base     $base  $text  $base   $base
client.background        $base

# Autostart
exec_always sh -c 'pkill -x nm-applet; exec nm-applet --indicator'
bindsym --to-code $mod+Shift+x exec ~/.config/sway/lock.sh

# Touchpad

# Window rules
for_window [app_id="pavucontrol|nm-connection-editor|blueman-manager"] floating enable, resize set 700 500, border pixel 2
for_window [window_role="pop-up"] floating enable
titlebar_padding 10 4
focus_follows_mouse no
workspace_auto_back_and_forth yes
bindsym --to-code $mod+Shift+p exec dms ipc call powermenu toggle

# Idle / lock
exec_always ~/.config/sway/idle.sh
