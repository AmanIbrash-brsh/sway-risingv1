# SwayFX effects (swayfx 0.6)

corner_radius 16
smart_corner_radius on

# Frosted-glass blur
blur enable
blur_xray disable
blur_passes 4
blur_radius 7
blur_noise 0.03
blur_brightness 0.85
blur_contrast 1.1
blur_saturation 1.2

# Shadows: soft white-ish glow on focused window, deep shadow on the rest
shadows enable
shadows_on_csd enable
shadow_blur_radius 30
shadow_offset 0 6
shadow_color #ffffff18
shadow_inactive_color #00000099

# Dim inactive windows
default_dim_inactive 0.15
dim_inactive_colors.unfocused #000000
dim_inactive_colors.urgent #ff5c5c

# Thin outline instead of fat border -> cleaner look
titlebar_separator disable

# Frosted glass for layers
layer_effects "waybar" blur enable; blur_ignore_transparent enable; corner_radius 14; shadows enable
layer_effects "rofi" blur enable; blur_ignore_transparent enable; corner_radius 20; shadows enable
layer_effects "notifications" blur enable; blur_ignore_transparent enable; corner_radius 14; shadows enable
layer_effects "swaynag" blur enable; blur_ignore_transparent enable; corner_radius 12

# Translucent terminals, glass shows through
# kitty opacity/blur is set in kitty.conf
for_window [app_id="scratch"] opacity 0.82
for_window [app_id="(?i)thunar|org.gnome.Nautilus"] opacity 0.92
for_window [app_id="pavucontrol|nm-connection-editor|blueman-manager"] opacity 0.92
