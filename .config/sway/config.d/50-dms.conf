# DankMaterialShell: bar, launcher, control center, notifications (replaces waybar/swaync/rofi launcher)
exec_always sh -c 'pgrep -x dms >/dev/null || exec dms run'

# Hotkeys: $mod+d launcher, $mod+n control center, $mod+Shift+n notifications, $mod+Shift+p power menu (set in config / config.d)
bindsym --to-code $mod+Shift+v exec dms ipc call clipboard toggle

# Media keys (work on the lock screen too); DMS shows the OSD
bindsym --locked XF86AudioRaiseVolume exec dms ipc call audio increment 5
bindsym --locked XF86AudioLowerVolume exec dms ipc call audio decrement 5
bindsym --locked XF86AudioMute exec dms ipc call audio mute
bindsym --locked XF86AudioMicMute exec dms ipc call audio micmute
bindsym --locked XF86MonBrightnessUp exec dms ipc call brightness increment 5 ""
bindsym --locked XF86MonBrightnessDown exec dms ipc call brightness decrement 5 ""
bindsym --locked XF86AudioPlay exec dms ipc call mpris playPause
bindsym --locked XF86AudioNext exec dms ipc call mpris next
bindsym --locked XF86AudioPrev exec dms ipc call mpris previous
