# DankMaterialShell: bar, launcher, control center, notifications (replaces waybar/swaync/rofi launcher)
exec_always sh -c 'pgrep -f "dms run" >/dev/null || exec dms run'

# Hotkeys: $mod+d launcher, $mod+n control center, $mod+Shift+n notifications, $mod+Shift+p power menu (set in config / config.d)
bindsym --to-code $mod+Shift+v exec dms ipc call clipboard toggle


# SwayFX blur/shadows/rounding for DMS surfaces (layer names from: swaymsg -t get_outputs)
layer_effects "dms:bar" blur enable; blur_ignore_transparent enable; corner_radius 14; shadows enable
layer_effects "dms:control-center" blur enable; blur_ignore_transparent enable; corner_radius 20; shadows enable
layer_effects "dms:app-launcher" blur enable; blur_ignore_transparent enable; corner_radius 20; shadows enable
layer_effects "dms:spotlight" blur enable; blur_ignore_transparent enable; corner_radius 20; shadows enable
layer_effects "dms:notification-center-popout" blur enable; blur_ignore_transparent enable; corner_radius 20; shadows enable
layer_effects "dms:notification-popup" blur enable; blur_ignore_transparent enable; corner_radius 14; shadows enable
layer_effects "dms:dash" blur enable; blur_ignore_transparent enable; corner_radius 20; shadows enable
layer_effects "dms:battery" blur enable; blur_ignore_transparent enable; corner_radius 20; shadows enable
layer_effects "dms:clipboard-popout" blur enable; blur_ignore_transparent enable; corner_radius 20; shadows enable
layer_effects "dms:network-info" blur enable; blur_ignore_transparent enable; corner_radius 20; shadows enable
layer_effects "dms:bluetooth-pairing" blur enable; blur_ignore_transparent enable; corner_radius 20; shadows enable
layer_effects "dms:osd" blur enable; blur_ignore_transparent enable; corner_radius 16; shadows enable
layer_effects "dms:dock" blur enable; blur_ignore_transparent enable; corner_radius 18; shadows enable
