# Input devices: edit freely. install.sh --layouts "us,de" rewrites the keyboard line.
# Keep a Latin layout FIRST: the hotkeys are bound with --to-code and work on the other layouts too.
input "type:keyboard" {
    xkb_layout "us,ru"
    xkb_options "grp:alt_shift_toggle,grp_led:scroll"
}

input type:touchpad {
    tap enabled
    tap_button_map lrm
    natural_scroll enabled
    dwt enabled
    middle_emulation enabled
}

# Mouse / touchpad speed (-1 slowest .. 1 fastest) goes into your own config.d/99-personal.conf
