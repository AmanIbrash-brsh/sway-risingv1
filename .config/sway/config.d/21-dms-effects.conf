# SwayFX blur for DMS surfaces (layer names: swaymsg -t get_outputs -r | jq '.[].layer_shell_surfaces[].namespace').
# Only blur: DMS surfaces are bigger than what is drawn, so shadows / corner_radius here would paint
# a glow and rounded corners around the whole (often full-screen) layer.
# SwayFX-only: install.sh drops this file when plain sway is used.
layer_effects "dms:bar" blur enable; blur_ignore_transparent enable
layer_effects "dms:notification-popup" blur enable; blur_ignore_transparent enable
layer_effects "dms:osd" blur enable; blur_ignore_transparent enable
layer_effects "dms:dock" blur enable; blur_ignore_transparent enable
