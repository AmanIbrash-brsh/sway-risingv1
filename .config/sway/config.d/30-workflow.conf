# Workflow helpers

# Drop-down scratchpad terminal: $mod+grave
exec kitty --class scratch
for_window [app_id="scratch"] move scratchpad, resize set 1000 560, move position center, border pixel 2
bindsym --to-code $mod+grave scratchpad show

# Workspace navigation
bindsym --to-code $mod+Tab workspace next_on_output
bindsym --to-code $mod+Shift+Tab workspace prev_on_output
bindsym --to-code $mod+Ctrl+Right workspace next_on_output
bindsym --to-code $mod+Ctrl+Left workspace prev_on_output

# Quick layout / window helpers
bindsym --to-code $mod+Shift+f floating toggle, resize set 1000 600, move position center
bindsym --to-code $mod+c exec swaymsg [con_id=__focused__] move position center

# Screenshots (saved to ~/Pictures/Screenshots and copied to the clipboard)
bindsym --to-code Print exec ~/.config/sway/screenshot.sh region
bindsym --to-code $mod+Shift+s exec ~/.config/sway/screenshot.sh region
bindsym --to-code Shift+Print exec ~/.config/sway/screenshot.sh full
bindsym --to-code Ctrl+Print exec ~/.config/sway/screenshot.sh window
bindsym --to-code Alt+Print exec ~/.config/sway/screenshot.sh scroll
bindsym --to-code $mod+Print exec ~/.config/sway/screenshot.sh last
bindsym --to-code Ctrl+Shift+Print exec ~/.config/sway/screenshot.sh edit

# Keep video/browser-video windows undimmed
for_window [app_id="firefox"] inhibit_idle fullscreen
for_window [app_id="mpv"] floating enable, dim_inactive 0

# Rice helpers
bindsym --to-code $mod+F1 exec ~/.config/sway/cheatsheet.sh
# Performance mode: toggle blur + shadows
bindsym --to-code $mod+Shift+b blur toggle; shadows toggle
# Control center (notifications + quick settings)
bindsym --to-code $mod+n exec dms ipc call control-center toggle
bindsym --to-code $mod+Shift+n exec dms ipc call notifications toggle
