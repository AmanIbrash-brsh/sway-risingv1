# Workflow helpers

# Drop-down scratchpad terminal: $mod+grave
exec kitty --class scratch
for_window [app_id="scratch"] move scratchpad, resize set 1000 560, move position center, border pixel 2
bindsym $mod+grave scratchpad show

# Workspace navigation
bindsym $mod+Tab workspace next_on_output
bindsym $mod+Shift+Tab workspace prev_on_output
bindsym $mod+Ctrl+Right workspace next_on_output
bindsym $mod+Ctrl+Left workspace prev_on_output

# Quick layout / window helpers
bindsym $mod+Shift+f floating toggle, resize set 1000 600, move position center
bindsym $mod+c exec swaymsg [con_id=__focused__] move position center

# Screenshots: area -> clipboard, area -> file
bindsym Shift+Print exec ~/.config/sway/screenshot.sh clip
bindsym $mod+Print exec ~/.config/sway/screenshot.sh file

# Keep video/browser-video windows undimmed
for_window [app_id="firefox"] inhibit_idle fullscreen
for_window [app_id="mpv"] floating enable, dim_inactive 0

# Mirror internal screen to HDMI/TV on hotplug
exec_always ~/.config/sway/mirror.sh
