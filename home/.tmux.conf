# Меняем префикс на Ctrl+A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Включаем поддержку мыши (чтобы скроллить и кликать по панелям как в GUI!)
set -g mouse on

# ---------- Usability ----------
set -g base-index 1                 # windows and panes start at 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10               # no lag on Esc (vim)
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on             # copy from tmux into the system clipboard (OSC52, kitty)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
setw -g aggressive-resize on

# Splits in the current directory, intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation / resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---------- Look (Tokyo Night, matches kitty) ----------
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1f2335,fg=#a9b1d6"
set -g status-left-length 30
set -g status-left "#[bg=#bb9af7,fg=#11111b,bold]  #S #[bg=#1f2335,fg=#bb9af7] "
set -g status-right-length 60
set -g status-right "#[fg=#7dcfff]#{?client_prefix,PREFIX ,}#[fg=#a9b1d6]#H #[fg=#565f89]| #[fg=#a9b1d6]%d.%m %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#3b4261,fg=#c0caf5,bold] #I:#W "
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#bb9af7"
set -g message-style "bg=#bb9af7,fg=#11111b"
